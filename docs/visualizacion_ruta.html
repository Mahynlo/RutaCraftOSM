<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Rutas - RutaCraftOSM</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/visualizador.css">
    
    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandCpp: '#06b6d4',
                        brandPython: '#f59e0b',
                        brandPrimary: '#3b82f6'
                    }
                }
            }
        }
    </script>
    
    <!-- Theme Manager -->
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Sidebar Panel -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="header-top-row">
                <div class="brand-title">
                    <i class="fa-solid fa-route" style="color: var(--cpp);"></i>
                    RutaCraftOSM
                    <span class="brand-badge">C++20</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="btn-theme-toggle" aria-label="Cambiar Tema" style="padding: 4px 8px; font-size: 0.75rem;"></button>
                    <a href="index.html" class="btn-home" title="Volver a la Documentación Principal">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </div>
            </div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 6px;" id="bench-meta">
                Rutas de los escenarios del benchmark
            </p>
            <label class="scenario-label" for="escenario-select">Escenario</label>
            <select id="escenario-select" class="scenario-select" onchange="selectEscenario(this.value)"></select>
        </div>

        <!-- Mode Selector -->
        <div class="tabs-container">
            <button class="tab-btn active-cpp" id="btn-cpp" onclick="setMode('cpp')">
                <i class="fa-solid fa-arrows-left-right"></i>
                Ignora sentidos
            </button>
            <button class="tab-btn" id="btn-py" onclick="setMode('py')">
                <i class="fa-solid fa-arrow-right-long"></i>
                Respeta sentidos
            </button>
            <button class="tab-btn" id="btn-compare" onclick="setMode('compare')">
                <i class="fa-solid fa-code-compare"></i>
                Comparación
            </button>
        </div>

        <!-- Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label"><i class="fa-solid fa-stopwatch"></i> Tiempo por ruta</div>
                <div class="metric-value" id="val-time" style="color: var(--cpp);">–</div>
                <div class="metric-sub" id="val-time-sub">Motor persistente</div>
            </div>
            <div class="metric-card">
                <div class="metric-label"><i class="fa-solid fa-road"></i> Distancia Total</div>
                <div class="metric-value" id="val-dist">–</div>
                <div class="metric-sub" id="val-dist-sub"></div>
            </div>
            <div class="metric-card">
                <div class="metric-label"><i class="fa-solid fa-draw-polygon"></i> Puntos Polilínea</div>
                <div class="metric-value" id="val-points">–</div>
                <div class="metric-sub" id="val-points-sub"></div>
            </div>
            <div class="metric-card">
                <div class="metric-label"><i class="fa-solid fa-location-dot"></i> Paradas GPS</div>
                <div class="metric-value" id="val-stops">–</div>
                <div class="metric-sub">Snapping KD-Tree</div>
            </div>
        </div>

        <!-- Comparación de distancia entre variantes -->
        <div class="benchmark-box">
            <div class="speedup-badge" id="diff-badge">
                <i class="fa-solid fa-scale-balanced"></i> <span id="diff-text"></span>
            </div>
            <div class="bar-container">
                <div class="bar-row">
                    <span class="bar-label" style="color: var(--cpp);">Ignora</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill fill-cpp" id="bar-normal"></div>
                    </div>
                    <span class="bar-value" style="color: var(--cpp);" id="bar-normal-val">–</span>
                </div>
                <div class="bar-row" id="bar-row-dirigido">
                    <span class="bar-label" style="color: var(--python);">Respeta</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill fill-py" id="bar-dirigido"></div>
                    </div>
                    <span class="bar-value" style="color: var(--python);" id="bar-dirigido-val">–</span>
                </div>
            </div>
        </div>

        <!-- Instructions Panel -->
        <div class="instructions-panel">
            <div class="section-title">
                <span><i class="fa-solid fa-diamond-turn-right"></i> Instrucciones de Navegación</span>
                <span id="inst-count" style="font-size: 0.75rem; color: var(--cpp);"></span>
            </div>
            <div id="instructions-list">
                <!-- Generado dinámicamente con JavaScript -->
            </div>
        </div>
    </aside>

    <!-- Map Container -->
    <main id="map-container">
        <div class="map-overlay-controls">
            <button class="floating-btn btn-theme-toggle" aria-label="Cambiar Tema"></button>
            <a href="index.html" class="floating-btn" style="text-decoration: none;" title="Volver a la Documentación Principal">
                <i class="fa-solid fa-house"></i> <span>Docs / Home</span>
            </a>
            <button class="floating-btn" onclick="centerRoute()" title="Centrar Ruta">
                <i class="fa-solid fa-arrows-to-eye"></i> <span>Centrar</span>
            </button>
            <button class="floating-btn" onclick="toggleStops()" title="Alternar Marcadores">
                <i class="fa-solid fa-map-pin"></i> <span>Marcadores</span>
            </button>
        </div>

        <div class="map-legend">
            <div class="legend-item">
                <div class="legend-color" style="background: var(--cpp); height: 5px;"></div>
                <span>Ignorando sentidos</span>
            </div>
            <div class="legend-item" id="legend-py-item" style="display: none;">
                <div class="legend-color" style="background: var(--python); height: 4px;"></div>
                <span>Respetando sentidos</span>
            </div>
            <div class="legend-item">
                <div style="width: 10px; height: 10px; border-radius: 50%; background: #10b981;"></div>
                <span>Punto Origen</span>
            </div>
            <div class="legend-item">
                <div style="width: 10px; height: 10px; border-radius: 50%; background: #ef4444;"></div>
                <span>Punto Destino</span>
            </div>
        </div>

        <div id="map"></div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-bar">
        <button class="mobile-view-btn active" id="btn-view-map" onclick="switchMobileView('map')">
            <i class="fa-solid fa-map-location-dot"></i> Ver Mapa
        </button>
        <button class="mobile-view-btn" id="btn-view-panel" onclick="switchMobileView('panel')">
            <i class="fa-solid fa-list-check"></i> Instrucciones & Stats
        </button>
    </nav>

    <!-- Modular Scripts -->
    <script src="js/rutas_benchmark.js"></script>
    <script src="js/visualizador.js"></script>
</body>
</html>
