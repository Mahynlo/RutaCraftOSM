<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación Técnica - RutaCraftOSM</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js (Markdown Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js (Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    
    <!-- Mermaid.js (Diagrams) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --cpp: #06b6d4;
            --python: #f59e0b;
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --code-bg: #0b1120;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 320px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-sections {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .nav-category {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 10px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: var(--surface-card);
            color: var(--text-main);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-left: 3px solid var(--primary);
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-visualizer {
            background: linear-gradient(135deg, var(--cpp), var(--primary));
            color: white;
        }

        .btn-home {
            background: var(--surface-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-home:hover { color: var(--text-main); }

        /* Content Area */
        #content-wrapper {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 40px 60px;
            scroll-behavior: smooth;
        }

        #doc-content {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Markdown Typography & Elements */
        #doc-content h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            color: #ffffff;
        }

        #doc-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 36px;
            margin-bottom: 16px;
            color: #f1f5f9;
        }

        #doc-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 24px;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        #doc-content p {
            margin-bottom: 16px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        #doc-content ul, #doc-content ol {
            margin-bottom: 20px;
            padding-left: 24px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        #doc-content li { margin-bottom: 6px; }

        #doc-content a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        #doc-content a:hover { text-decoration: underline; }

        #doc-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #doc-content th, #doc-content td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        #doc-content th {
            background: var(--surface);
            color: #f8fafc;
            font-weight: 700;
            font-size: 0.88rem;
        }

        #doc-content td {
            background: rgba(30, 41, 59, 0.4);
            font-size: 0.88rem;
        }

        #doc-content tr:last-child td { border-bottom: none; }

        #doc-content code:not(pre code) {
            background: rgba(51, 65, 85, 0.7);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88em;
        }

        #doc-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin: 20px 0;
            overflow-x: auto;
        }

        #doc-content pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        /* Callout Alerts */
        .callout {
            padding: 16px 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid;
            background: rgba(30, 41, 59, 0.5);
            font-size: 0.92rem;
        }

        .callout-title {
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .callout-note { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .callout-note .callout-title { color: #60a5fa; }

        .callout-tip { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .callout-tip .callout-title { color: #34d399; }

        .callout-important { border-color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .callout-important .callout-title { color: #c084fc; }

        .callout-warning { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .callout-warning .callout-title { color: #fbbf24; }

        /* Mermaid Box */
        .mermaid {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        /* Loading Spinner */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            color: var(--text-muted);
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; max-height: 250px; }
            #content-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="brand-title">
                <i class="fa-solid fa-route" style="color: var(--cpp);"></i>
                RutaCraftOSM
            </a>
            <span style="font-size: 0.7rem; background: var(--surface-card); padding: 2px 6px; border-radius: 4px; font-weight: 700;">Docs</span>
        </div>

        <div class="nav-sections">
            <div class="nav-category">Guías Técnicas</div>
            <a href="doc.html?doc=1_ARQUITECTURA_Y_MIGRACION.md" class="nav-item" id="nav-1">
                <i class="fa-solid fa-sitemap"></i> 1. Arquitectura y Migración
            </a>
            <a href="doc.html?doc=2_IMPLEMENTACION_PYTHON_UV.md" class="nav-item" id="nav-2">
                <i class="fa-brands fa-python"></i> 2. Pipeline Python (uv)
            </a>
            <a href="doc.html?doc=3_MOTOR_CPP_RUTACRAFT.md" class="nav-item" id="nav-3">
                <i class="fa-solid fa-microchip"></i> 3. Motor Nativo C++20
            </a>
            <a href="doc.html?doc=4_INTEGRACION_TYPESCRIPT_ELECTRON.md" class="nav-item" id="nav-4">
                <i class="fa-brands fa-node-js"></i> 4. NPM y Electron
            </a>
            <a href="doc.html?doc=README.md" class="nav-item" id="nav-readme">
                <i class="fa-solid fa-book"></i> Índice General (README)
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="visualizacion_ruta.html" class="btn-action btn-visualizer">
                <i class="fa-solid fa-map-location-dot"></i> Visualizador Interactivo
            </a>
            <a href="index.html" class="btn-action btn-home">
                <i class="fa-solid fa-house"></i> Volver a Home
            </a>
        </div>
    </aside>

    <!-- Main Content Reader -->
    <main id="content-wrapper">
        <div id="loader">
            <div class="spinner"></div>
            <p>Cargando documentación...</p>
        </div>
        <article id="doc-content" style="display: none;"></article>
    </main>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                background: '#0f172a',
                primaryColor: '#3b82f6',
                primaryTextColor: '#fff',
                lineColor: '#06b6d4',
                secondaryColor: '#f59e0b',
                tertiaryColor: '#1e293b'
            }
        });

        // Configurar Marked con soporte para Highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (__) {}
                }
                return hljs.highlightAuto(code).value;
            },
            gfm: true,
            breaks: false
        });

        // Transformar alertas GitHub (> [!NOTE], etc.)
        function transformGitHubAlerts(html) {
            const alertTypes = {
                'NOTE': { class: 'callout-note', icon: 'fa-circle-info', title: 'Nota' },
                'TIP': { class: 'callout-tip', icon: 'fa-lightbulb', title: 'Consejo' },
                'IMPORTANT': { class: 'callout-important', icon: 'fa-triangle-exclamation', title: 'Importante' },
                'WARNING': { class: 'callout-warning', icon: 'fa-circle-exclamation', title: 'Advertencia' },
                'CAUTION': { class: 'callout-warning', icon: 'fa-hand', title: 'Precaución' }
            };

            return html.replace(/<blockquote>\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, function(match, type, content) {
                const conf = alertTypes[type.toUpperCase()] || alertTypes.NOTE;
                return `
                    <div class="callout ${conf.class}">
                        <div class="callout-title"><i class="fa-solid ${conf.icon}"></i> ${conf.title}</div>
                        <div>${content}</div>
                    </div>
                `;
            });
        }

        // Obtener nombre del archivo desde URL (?doc=...)
        function getTargetDoc() {
            const params = new URLSearchParams(window.location.search);
            const doc = params.get('doc');
            if (doc) return doc;
            const hash = window.location.hash.replace('#', '');
            if (hash) return hash;
            return '1_ARQUITECTURA_Y_MIGRACION.md';
        }

        // Cargar y renderizar Markdown
        async function loadDocument(docFile) {
            const loader = document.getElementById('loader');
            const contentEl = document.getElementById('doc-content');

            loader.style.display = 'flex';
            contentEl.style.display = 'none';

            // Actualizar menú activo
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('href').includes(docFile)) {
                    item.classList.add('active');
                }
            });

            try {
                const response = await fetch(docFile);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: No se pudo cargar el archivo ${docFile}`);
                }
                const markdownText = await response.text();

                // 1. Extraer bloques de mermaid para preservarlos antes de marked
                const mermaidBlocks = [];
                let processedMd = markdownText.replace(/```mermaid([\s\S]*?)```/g, (match, code) => {
                    const id = `mermaid-placeholder-${mermaidBlocks.length}`;
                    mermaidBlocks.push({ id, code: code.trim() });
                    return `<div class="mermaid" id="${id}">${code.trim()}</div>`;
                });

                // 2. Parsear Markdown a HTML
                let parsedHtml = marked.parse(processedMd);

                // 3. Transformar alertas de GitHub
                parsedHtml = transformGitHubAlerts(parsedHtml);

                contentEl.innerHTML = parsedHtml;

                // 4. Interceptar links internos a archivos .md
                contentEl.querySelectorAll('a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && (href.endsWith('.md') || href.includes('.md#'))) {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            let cleanFile = href.replace(/^\.\//, '').split('#')[0];
                            window.history.pushState(null, '', `doc.html?doc=${cleanFile}`);
                            loadDocument(cleanFile);
                        });
                    }
                });

                loader.style.display = 'none';
                contentEl.style.display = 'block';

                // 5. Renderizar diagramas de Mermaid
                await mermaid.run({
                    nodes: contentEl.querySelectorAll('.mermaid')
                });

                // Scroll to top
                document.getElementById('content-wrapper').scrollTop = 0;

            } catch (err) {
                loader.style.display = 'none';
                contentEl.style.display = 'block';
                contentEl.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ef4444;">
                        <h2><i class="fa-solid fa-triangle-exclamation"></i> Error al cargar documento</h2>
                        <p style="color: var(--text-muted); margin-top: 10px;">${err.message}</p>
                        <a href="index.html" class="btn-action btn-home" style="display: inline-block; margin-top: 20px;">
                            Volver al Inicio
                        </a>
                    </div>
                `;
            }
        }

        // Cargar documento inicial
        const initialDoc = getTargetDoc();
        loadDocument(initialDoc);

        // Soporte para botón atrás/adelante en el navegador
        window.addEventListener('popstate', () => {
            loadDocument(getTargetDoc());
        });
    </script>
</body>
</html>
